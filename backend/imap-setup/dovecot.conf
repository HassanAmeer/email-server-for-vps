# ==============================================================================
# Dovecot IMAP Configuration for Email Server VPS
# ==============================================================================

# Protocols enabled
protocols = imap

# Listen on all IPv4 and IPv6 interfaces
listen = *, ::

# Base directory for Dovecot run files
base_dir = /var/run/dovecot/

# Authentication Configuration
auth_mechanisms = plain login
disable_plaintext_auth = no
auth_verbose = yes

# Mail Location: Standard Maildir layout matching the Bun/Node email server
# %d = domain (e.g. mailserver10.com), %n = username (e.g. support)
mail_location = maildir:/var/www/email-server-for-vps/backend/storage/maildir/%d/%n:LAYOUT=fs:DIRNAME=.

# Namespace Configuration
namespace inbox {
  inbox = yes
  separator = /
  
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

# SSL / TLS Settings
# For local development: SSL is optional (disable_plaintext_auth = no)
# For production VPS with SSL: Change to ssl = yes and uncomment your Let's Encrypt certificates
ssl = no
# ssl_cert = </etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
# ssl_key = </etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ALL:!LOW:!SSLv2:!EXP:!aNULL

# IMAP & IMAPS Service Ports
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  process_min_avail = 1
  client_limit = 1000
}

# Authentication Services
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

# SQL Database Authentication (SQLite)
passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}
